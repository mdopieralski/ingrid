name: Setup
description: Install pnpm, Node (from .nvmrc) and dependencies from the lockfile, with the pnpm store cached.

runs:
  using: composite
  steps:
    # Before setup-node, so its pnpm cache has a store to point at.
    # The pnpm version comes from "packageManager" in package.json.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    # Also registers the ESLint problem matchers, so lint errors show inline on the PR.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - shell: bash
      run: pnpm install --frozen-lockfile
      env:
        HUSKY: '0' # git hooks are for local commits; CI runs the checks itself
