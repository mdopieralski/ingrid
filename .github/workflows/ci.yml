name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR cancels that PR's run still in progress. Runs on main are
# never cancelled, so every commit on main gets a full verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# One job per check, run in parallel: each shows up as its own status on the PR,
# so a failure says what broke without opening the log.
jobs:
  format:
    name: Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm standard:format

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm standard:lint

  # The spec linter is fetched from the registry at a pinned version instead of
  # being carried in the lockfile: it is a large CLI used by exactly one script.
  # That is a deliberate trade-off, and the only step here that reaches out.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  # Compiles src/ to dist/, then starts the compiled server and calls it. That
  # catches what type-checking cannot: a file missing from dist/ (openapi.yaml)
  # or an import path that only works when running the .ts sources.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: Smoke-test the build
        run: |
          PORT=3000 node dist/index.js &
          for _ in $(seq 1 20); do
            if curl -fsS http://localhost:3000/health; then
              curl -fsS -o /dev/null http://localhost:3000/openapi.json
              curl -fsS -o /dev/null http://localhost:3000/docs
              exit 0
            fi
            sleep 0.5
          done
          echo "the built server did not answer on /health"
          exit 1

  # Runs Vercel's own build (no Vercel account needed), checks the function it
  # produces, then starts that function and calls it. Vercel type-checks,
  # picks the entry file and bundles files its own way; this job is where a
  # change that would break the deployment fails, before it reaches Vercel.
  vercel:
    name: Vercel build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm vercel:check

  openapi:
    name: OpenAPI spec
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm docs:lint

  # The integration test stays skipped: the test suite must not depend on the
  # shared, rate-limited OSRM demo instance. Everything else runs against a local stub.
  # integration.yml runs the live test on a schedule instead.
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test:ci
      - name: Upload JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-report
          path: junit.xml
          retention-days: 14

  # The commit-msg hook can be skipped with --no-verify; this cannot.
  # Dependabot is skipped: its commit bodies carry long release-note lines.
  commits:
    name: Commit messages
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # commitlint needs the PR's commits, not just the merge commit
      - uses: ./.github/actions/setup
      - run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  # The single check to mark as required in branch protection. Adding or renaming
  # a job above then needs no change to the protection rules, only to `needs`.
  ci-passed:
    name: CI passed
    if: always()
    needs: [format, lint, typecheck, build, vercel, openapi, test, commits]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if any check failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "$NEEDS"
          exit 1
        env:
          NEEDS: ${{ toJSON(needs) }}
      - run: echo "All checks passed."
